- name: Jaime Enrique Garcia Lopez
  title: 高级软件开发经理
  company: Capital One
  quote: |-
    “当时团队里没有人会 Go，但<strong>不到一个月，所有人都已经开始用 Go 编写代码</strong>，着手构建服务端点。Go 的灵活性、易用性，以及其背后很棒的设计理念——原生并发、垃圾回收，当然还有安全性与速度——让我们在开发过程中充满热情。而且，谁能抗拒这么可爱的吉祥物呢！”
- name: Clayton Coleman
  title: Open Shift 首席工程师
  company: RedHat
  quote: |-
    “<strong>一门精简且编译快速的语言，能让开发者工作得更愉快。</strong>Go 语言很精简，编译速度很快，因此你可以把精力放在实际问题上，而不是解决问题所用的工具上。编码、测试和调试的反馈如此迅速，让人几乎忘了它并非解释型语言。看看我们的代码，就能发现<strong>样板代码更少，业务逻辑更多。</strong>”
- name: Matt Boyle
  title: 首席软件工程师
  company: Curve
  quote: |-
    “<strong>Go 具备出色的可扩展性，使用它编写的服务通常只占用很少的内存。</strong>代码可以编译成一个静态二进制文件，服务也就很容易容器化，构建和部署因此更加简单。这些特点让<strong>Go 成为企业构建微服务的理想选择</strong>：你可以轻松地将服务部署到 Kubernetes 等高可用、可扩展的环境中。”
- name: Bala Natarajan
  title: 开发者体验高级工程总监
  company: PayPal
  quote: |-
    “在我们严格管理的 Go 代码运行环境中，<strong>CPU 使用量降低了约 10%</strong>，同时代码更加清晰，也更易维护。”
- name: Benjamin Cane
  title: 副总裁兼首席工程师
  company: American Express
  quote: |-
    “工具链一直是我们旧代码库的一大难题……但我们发现，Go 不仅拥有出色的工具链，还内置了测试、基准测试和性能剖析框架。编写高效、健壮的应用程序变得很容易。<strong>使用 Go 之后，我们的大多数开发者都不想再回到其他语言了。</strong>”
- name: John Biggs and Ben Popper
  title:
  company: Stack Overflow
  quote: |-
    “……当一门编程语言正是为我们大多数人当前使用的环境——经过性能优化、可扩展的云服务器——而设计时，许多问题就能迎刃而解。”