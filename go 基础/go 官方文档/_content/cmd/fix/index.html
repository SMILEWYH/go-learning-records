<h1>fix 命令
</h1>




	
		
		<p>Fix 是由“go fix”执行的工具，用于将采用旧语言特性或旧库功能的 Go 程序改写为使用更新的功能。升级到新的 Go 版本后，fix 可以帮助你对程序进行必要修改。
<p>如何运行本命令，请参阅“go fix”的文档。可以通过“go fix -fixtool=...”指定其他工具。
<p>运行“go tool fix help”可以查看本程序支持的分析器列表。
<p>关于如何编写能够提出修复建议的分析器，请参阅 <a href="/pkg/golang.org/x/tools/go/analysis/">golang.org/x/tools/go/analysis</a>。
