<h1>pprof 命令
</h1>




	
		
		<p>Pprof 解析并展示 Go 程序的性能剖析数据。
<p>基本用法：
<pre>go tool pprof binary profile
</pre>
<p>详细用法：
<pre>go tool pprof -h
</pre>
<p>示例请参阅 <a href="/blog/pprof">https://go.dev/blog/pprof</a>。
