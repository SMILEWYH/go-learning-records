<h1>preprofile 命令
</h1>




	
		
		<p>Preprofile 为 pprof 性能剖析数据创建中间表示，供编译器在性能剖析引导优化（PGO）中使用。这种转换仅依赖剖析数据本身，因此每次调用编译器时都重复转换会造成浪费。
<p>用法：
<pre>go tool preprofile [-V] [-o output] -i input
</pre>
