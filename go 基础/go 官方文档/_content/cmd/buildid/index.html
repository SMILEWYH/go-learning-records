<h1>buildid 命令
</h1>




	
		
		<p>Buildid 显示或更新 Go 包或二进制文件中存储的构建 ID。
<p>用法：
<pre>go tool buildid [-w] file
</pre>
<p>默认情况下，buildid 输出指定文件中的构建 ID。如果指定 -w 选项，则重写文件中的构建 ID，使其准确记录该文件的内容哈希。
<p>本工具仅供 go 命令或其他构建系统使用。
</article>
