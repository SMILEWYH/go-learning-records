<text x="82" y="896" font-size="20" font-weight="400" text-anchor="start" class="code">SELECT id, phone, name FROM tb_user WHERE phone = &#x27;17799990006&#x27; AND name = &#x27;露娜&#x27;;</text>
<text x="82" y="928" font-size="19" font-weight="400" text-anchor="start">① 根节点 → 右中间节点     ② 进入叶子 L4     ③ 匹配第一条记录     ④ 直接返回 (7, 17799990006, 露娜)</text>
<text x="82" y="959" font-size="19" font-weight="600" text-anchor="start" fill="#166f5c" style="fill:#166f5c">phone、name 和 id 均在该索引的叶子节点中：使用此索引时，属于覆盖索引，无需回表。</text>
<text x="60" y="1008" font-size="17" font-weight="400" text-anchor="start" fill="#6f7e8e" style="fill:#6f7e8e">结构按原截图重绘；绿色路径为补充示例。每页容量仅用于教学示意，实际执行计划由优化器决定。</text>
