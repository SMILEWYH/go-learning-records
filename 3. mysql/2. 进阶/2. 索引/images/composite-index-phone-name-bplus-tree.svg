<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030" role="img" aria-labelledby="title desc">
<title id="title">联合索引 idx_phone_name 的完整 B+Tree 结构与查询路径</title>
<desc id="desc">根节点为 17799990006 露娜；左中间节点包含赵云和花木兰，右中间节点包含项羽。五组双向连接的叶子节点保存十条 phone、name、id 记录。绿色路径查询露娜并直接返回 id 等于 7 的覆盖索引结果。</desc>
