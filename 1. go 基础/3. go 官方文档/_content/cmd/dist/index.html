<h1>dist 命令
</h1>




	
		
		<p>Dist 帮助完成 Go 发行版的引导构建、构建和测试。
<p>用法：
<pre>go tool dist [command]
</pre>
<p>可用命令如下：
<pre>banner         输出安装提示横幅
bootstrap      重新构建所有内容
clean          删除全部已构建文件
env [-p]       输出环境信息（-p：包括 $PATH）
install [dir]  安装单个目录
list [-json]   列出所有支持的平台
test [-h]      运行 Go 测试
version        输出 Go 版本
</pre>
