<article class="Pkg Article">

<h1>addr2line 命令
</h1>




	
		
		<p>Addr2line 是 GNU addr2line 工具的一个精简模拟实现，仅提供支持 pprof 所需的功能。
<p>用法：
<pre>go tool addr2line binary
</pre>
<p>Addr2line 从标准输入读取十六进制地址，每行一个，可带 0x 前缀。对于每个输入地址，addr2line 输出两行：第一行是包含该地址的函数名，第二行是该地址对应源代码的文件名和行号，格式为 file:line。
<p>本工具仅供 pprof 使用；其接口可能在未来版本中变更，也可能被完全删除。
</article>
