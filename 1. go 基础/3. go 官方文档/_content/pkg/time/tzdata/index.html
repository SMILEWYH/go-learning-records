				<p>tzdata 包提供时区数据库的嵌入副本。如果程序中的任何位置导入了此包，那么当 time 包无法在系统上找到 tzdata 文件时，就会使用这些嵌入的信息。<p>导入此包会使程序大小增加约 450 KB。<p>此包通常应由程序的 main 包导入，而不应由库导入。库通常不应决定是否将时区数据库包含在程序中。<p>如果构建时使用 -tags timetzdata，则会自动导入此包。</div>
