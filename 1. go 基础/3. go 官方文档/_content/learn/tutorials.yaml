- title: 快速入门
  content: 本教程简要介绍 Go 编程。你将安装 Go，编写简单的“Hello, world”程序，使用 go 命令运行代码，通过 Go 包检索工具查找包，并调用外部模块中的函数。
  url: /doc/tutorial/getting-started
  thumbnail:
  cta: 教程
- title: 创建模块
  content: 这是介绍 Go 语言若干基础特性的系列教程的第一部分。你将创建两个模块：第一个是供其他库或应用程序导入的库，第二个是调用该库的应用程序。
  url: /doc/tutorial/create-module
  thumbnail:
  cta: 教程
- title: 开发 Web 服务
  content: 本教程介绍使用 Go 和 Gin Web 框架编写 RESTful Web 服务 API 的基础知识。你将构建一个包含两个端点的 RESTful API 服务器。
  url: https://shell.cloud.google.com/?walkthrough_tutorial_url=https%3A%2F%2Fraw.githubusercontent.com%2Fgolang%2Ftour%2Fmaster%2Ftutorial%2Fweb-service-gin.md&pli=1&show=ide&environment_deployment=ide
  thumbnail:
  cta: 交互式教程
- title: 访问关系型数据库
  content: 本教程介绍使用 Go 和标准库中的 database/sql 包访问关系型数据库的基础知识。你将创建一个数据库，然后编写代码访问它。
  url: /doc/tutorial/database-access
  thumbnail:
  cta: 教程
