<h1>Command pprof</h1>




	
		
		<p>Pprof interprets and displays profiles of Go programs.
<p>Basic usage:
<pre>go tool pprof binary profile
</pre>
<p>For detailed usage information:
<pre>go tool pprof -h
</pre>
<p>For an example, see <a href="/blog/pprof">https://go.dev/blog/pprof</a>.
