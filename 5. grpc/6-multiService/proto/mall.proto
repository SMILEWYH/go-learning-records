syntax = "proto3";
// 现在我们演示单个 proto 文件下多个服务，所以没有 package 是允许的

option go_package = "grpc-learning/6-multiService/proto;online_mall";

// 商品服务
service ProductService {
  rpc Find(Request) returns (Response) {}
}

// 订单服务
service OrderService {
  rpc Find(Request) returns (Response) {}
}

message Request {
  int64 ID = 1;
}

message Response {
  int64 price = 1;
}
