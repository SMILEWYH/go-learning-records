syntax = "proto3"; 
package hello_grpc;     

// option go_package = "./xxx;yyy"; 
// xxx 是文件名, yyy 是 go 包名
// 或者简写 /hello_grpc 也可以
option go_package = ".;hello_grpc";

// service 对应的就是go里面的接口，可以作为服务端, 客户端
service HelloService {
  // rpc 对应的就是结构体中的方法
  rpc SayHello (HelloRequest) returns (HelloResponse) {}
}

// message对应的也是结构体
message HelloRequest {
  string name = 1;
  string message = 2;
}

message HelloResponse{
  string name = 1;
  string message = 2;
}