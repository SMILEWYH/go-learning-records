syntax = "proto3"; 

option go_package = ".;dataType_grpc";

// 编写风格
// 1.文件名建议下划线，例如:my_student.proto
// 2.包名和目录名对应
// :3.服务名、方法名、消息名均为大驼峰
// 4.字段名为下划线

// 基础类型 start:

message BasicType {
  double a1 = 1;
  float a2 = 2;
  int32 a3 = 3;
  int64 a4 = 4;
  uint32 a5 = 5;
  uint64 a6 = 6;
  sint32 a7 = 7;
  sint64 a8 = 8;
  fixed32 a9 = 9;
  fixed64 a10 = 10;
  sfixed32 a11 = 11;
  sfixed64 a12 = 12;
  bool a13 = 13;
  string a14 = 14;
  bytes a15 = 15;
}

// 基础数据类型生成的 go 代码:
/*
