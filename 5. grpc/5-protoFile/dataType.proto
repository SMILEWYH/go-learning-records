}
*/

// proto3 普通基础类型字段（未使用 optional）：
// 值为默认值时，序列化会省略该字段。
// 解析时，缺失字段读取为默认值。
// 因此无法区分“没有赋值”和“明确赋了默认值”

// 单个消息字段：
// 未提供（nil）时，序列化会省略该字段。
// 已提供时，即使消息内部为空，也会序列化该字段。
// 解析后可以通过是否为 nil，区分“未提供”和“提供了空消息”。

// `repeated Request` 列表不区分“未提供列表”和“提供了空列表”。

// strings: 空字符串
// bytes: 空序列
// bool: false
// 数值类型: 0

// 基础类型 end

// 数组类型 start: 

message Request {
  int64 a1 
}

message ArrayRequest {
  repeated int64 a1 = 1;
  repeated string a2 = 2;
  repeated Request request_list = 3;
}

// 数组类型生成的 go 代码:
/*
// 基础类型字段默认不区分“没提供”和“提供了零值”, 因为在 go 中都会为默认值
// 而消息类型需要区分“没提供”和“提供了一个空消息”, 所以提供指针来判断是否为 nil

type ArrayRequest struct {
  A1          []int64 
  A2          []string   
  RequestList []*Request
}
*/

// 数组类型 end

// Map 数据类型 start: 

message MapRequest {
  map<int64, string> m_i_s = 1;
  map<string, bool> m_i_b = 2;
  map<string, ArrayRequest> m_i_arr = 3;
}

// Map 数据类型生成的 go 代码:
/*
type MapRequest struct {
  MIS   map[int64]string
  MIB   map[string]bool
  MIArr map[string]*ArrayRequest
}
*/

// Map 数据类型 end

// 嵌套数据类型 start: 

message Q1 {
  message Q2{
    string name2 = 2;
  }
  string name1 = 1;
  Q2 q2 = 2;
}

// 嵌套数据类型生成的 go 代码:
/*
