  A2  float32 `protobuf:"fixed32,2,opt,name=a2,proto3" json:"a2,omitempty"`
  A3  int32   `protobuf:"varint,3,opt,name=a3,proto3" json:"a3,omitempty"`
  A4  int64   `protobuf:"varint,4,opt,name=a4,proto3" json:"a4,omitempty"`
  A5  uint32  `protobuf:"varint,5,opt,name=a5,proto3" json:"a5,omitempty"`
  A6  uint64  `protobuf:"varint,6,opt,name=a6,proto3" json:"a6,omitempty"`
  A7  int32   `protobuf:"zigzag32,7,opt,name=a7,proto3" json:"a7,omitempty"`
  A8  int64   `protobuf:"zigzag64,8,opt,name=a8,proto3" json:"a8,omitempty"`
  A9  uint32  `protobuf:"fixed32,9,opt,name=a9,proto3" json:"a9,omitempty"`
  A10 uint64  `protobuf:"fixed64,10,opt,name=a10,proto3" json:"a10,omitempty"`
  A11 int32   `protobuf:"fixed32,11,opt,name=a11,proto3" json:"a11,omitempty"`
  A12 int64   `protobuf:"fixed64,12,opt,name=a12,proto3" json:"a12,omitempty"`
  A13 bool    `protobuf:"varint,13,opt,name=a13,proto3" json:"a13,omitempty"`
  A14 string  `protobuf:"bytes,14,opt,name=a14,proto3" json:"a14,omitempty"`
